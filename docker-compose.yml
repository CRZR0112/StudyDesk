services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      STUDYDESK_DATA_DIR: /app/data
      STUDYDESK_PUBLIC_URL: ${STUDYDESK_PUBLIC_URL:?set STUDYDESK_PUBLIC_URL in .env}
      STUDYDESK_TRUST_PROXY: "1"
      STUDYDESK_PIN: ${STUDYDESK_PIN:-}
    volumes:
      - studydesk-data:/app/data
    expose:
      - "4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  studydesk-data:
  caddy-data:
  caddy-config:
